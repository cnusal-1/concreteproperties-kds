# concreteproperties-kds 정적 검사 설정
line-length = 88
target-version = "py311"

# 노트북은 생성물이므로 검사 대상에서 제외한다
extend-exclude = ["docs/examples", "docs/_build", "docs/gen"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[lint.per-file-ignores]
# 노트북 생성 스크립트는 셀 내용을 문자열로 담고 있어 줄 길이를 제한하지 않는다
"scripts/build_notebooks.py" = ["E501"]
