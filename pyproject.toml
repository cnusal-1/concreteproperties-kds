[project]
name = "concreteproperties-kds"
version = "0.1.0"
description = "concreteproperties 를 KDS 14 20 (콘크리트구조 설계기준) 에 맞추어 사용하기 위한 설계기준 확장 패키지"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "kds",
    "concrete",
    "reinforced-concrete",
    "structural-engineering",
    "korean-design-standard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Natural Language :: Korean",
]
dependencies = [
    "concreteproperties>=0.7",
    "numpy",
    "scipy",
    "rich",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concreteproperties_kds"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
