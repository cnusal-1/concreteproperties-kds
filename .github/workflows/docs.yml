name: 문서 사이트 배포

# Sphinx 문서를 빌드해 GitHub Pages 로 배포한다.
# configure-pages 의 enablement 로 Pages 설정까지 자동으로 켜므로,
# 저장소 설정을 손댈 필요가 없다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 한다 (진행 중인 배포는 취소하지 않는다)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 의존 패키지 설치
        run: pip install -e ".[docs]"

      # 노트북은 저장소에 실행 결과까지 담겨 있고 conf.py 의
      # nb_execution_mode = "off" 로 그대로 쓴다 (빌드 시간·재현성).
      - name: 문서 빌드
        run: sphinx-build -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
